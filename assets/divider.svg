<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B0000" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C0392B" stop-opacity="1"/>
      <stop offset="1" stop-color="#8B0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFB3AA" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="track"><rect x="0" y="11" width="1200" height="2"/></clipPath>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#line)"/>
  <g clip-path="url(#track)">
    <rect x="-160" y="11" width="160" height="2" fill="url(#shine)">
      <animate attributeName="x" values="-160;1200" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(600 12) rotate(45)">
    <rect x="-6" y="-6" width="12" height="12" fill="#0D1117" stroke="#C0392B" stroke-width="2"/>
    <rect x="-2.5" y="-2.5" width="5" height="5" fill="#C0392B">
      <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
