<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Jessie Albert Regualos — Full-Stack Developer">
  <title>Jessie Albert Regualos — Full-Stack Developer</title>
  <style>
    .mono { font-family: Consolas, 'Fira Code', 'SFMono-Regular', 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; }
    .float-a { animation: float 5s ease-in-out infinite; }
    .float-b { animation: float 6s ease-in-out infinite; animation-delay: -2s; }
    .spin { animation: pulse 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090D"/>
      <stop offset=".55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#1A0505"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C0392B" stop-opacity=".35"/>
      <stop offset="1" stop-color="#C0392B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3C2BC"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0392B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C0392B" stop-opacity=".10"/>
      <stop offset="1" stop-color="#C0392B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="240" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="floorMask">
      <rect x="0" y="240" width="1200" height="120" fill="url(#floorFade)"/>
    </mask>

    <!-- Solid isometric cube (edge = 40) -->
    <g id="cube">
      <polygon points="0,-40 34.64,-20 0,0 -34.64,-20" fill="#C0392B"/>
      <polygon points="-34.64,-20 0,0 0,40 -34.64,20" fill="#8B0000"/>
      <polygon points="0,0 34.64,-20 34.64,20 0,40" fill="#3B0A0A"/>
      <polygon points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20" fill="none" stroke="#FF6B5B" stroke-opacity=".45" stroke-width="1"/>
      <polyline points="-34.64,-20 0,0 34.64,-20" fill="none" stroke="#FF6B5B" stroke-opacity=".3" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#FF6B5B" stroke-opacity=".3" stroke-width="1"/>
    </g>

    <!-- Wireframe isometric cube -->
    <g id="wire" fill="none" stroke="#FF6B5B" stroke-width="1.4" stroke-linejoin="round">
      <polygon points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20"/>
      <polyline points="-34.64,-20 0,0 34.64,-20"/>
      <line x1="0" y1="0" x2="0" y2="40"/>
      <polyline points="-34.64,20 0,0 34.64,20" stroke-opacity=".25" stroke-dasharray="3 4"/>
      <line x1="0" y1="-40" x2="0" y2="0" stroke-opacity=".25" stroke-dasharray="3 4"/>
    </g>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <ellipse cx="600" cy="175" rx="520" ry="150" fill="url(#glow)"/>

  <!-- Perspective floor -->
  <g mask="url(#floorMask)" stroke="#C0392B" stroke-width="1" stroke-opacity=".55">
    <line x1="600" y1="240" x2="-1200" y2="360"/>
    <line x1="600" y1="240" x2="-800" y2="360"/>
    <line x1="600" y1="240" x2="-400" y2="360"/>
    <line x1="600" y1="240" x2="0" y2="360"/>
    <line x1="600" y1="240" x2="200" y2="360"/>
    <line x1="600" y1="240" x2="400" y2="360"/>
    <line x1="600" y1="240" x2="600" y2="360"/>
    <line x1="600" y1="240" x2="800" y2="360"/>
    <line x1="600" y1="240" x2="1000" y2="360"/>
    <line x1="600" y1="240" x2="1200" y2="360"/>
    <line x1="600" y1="240" x2="1600" y2="360"/>
    <line x1="600" y1="240" x2="2000" y2="360"/>
    <line x1="600" y1="240" x2="2400" y2="360"/>
    <line x1="0" y1="246" x2="1200" y2="246"/>
    <line x1="0" y1="254" x2="1200" y2="254"/>
    <line x1="0" y1="265" x2="1200" y2="265"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="301" x2="1200" y2="301"/>
    <line x1="0" y1="328" x2="1200" y2="328"/>
    <line x1="0" y1="242" x2="1200" y2="242" stroke-width="2" stroke-opacity="1">
      <animate attributeName="y1" values="242;360" dur="3s" calcMode="spline" keySplines=".6 0 1 1" repeatCount="indefinite"/>
      <animate attributeName="y2" values="242;360" dur="3s" calcMode="spline" keySplines=".6 0 1 1" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Left isometric cluster -->
  <use href="#cube" xlink:href="#cube" x="140" y="250"/>
  <use href="#cube" xlink:href="#cube" x="174.64" y="270"/>
  <use href="#cube" xlink:href="#cube" x="105.36" y="270"/>
  <use href="#cube" xlink:href="#cube" x="140" y="290"/>
  <use href="#cube" xlink:href="#cube" x="105.36" y="230"/>
  <g class="float-b">
    <use href="#wire" xlink:href="#wire" x="150" y="135"/>
  </g>

  <!-- Right isometric cluster -->
  <use href="#cube" xlink:href="#cube" x="1060" y="250"/>
  <use href="#cube" xlink:href="#cube" x="1094.64" y="270"/>
  <use href="#cube" xlink:href="#cube" x="1025.36" y="270"/>
  <use href="#cube" xlink:href="#cube" x="1060" y="290"/>
  <use href="#cube" xlink:href="#cube" x="1060" y="210"/>
  <g class="float-a">
    <use href="#cube" xlink:href="#cube" x="1060" y="115"/>
  </g>

  <!-- Eyebrow -->
  <text x="600" y="100" text-anchor="middle" class="mono" font-size="13" letter-spacing="5" fill="#C0392B">◆ MEMORY SEQUENCE 01 — SUBJECT PROFILE ◆</text>

  <!-- 3D extruded name -->
  <g class="sans" font-size="50" text-anchor="middle">
    <text x="606" y="171" textLength="740" lengthAdjust="spacingAndGlyphs" fill="#150202">JESSIE ALBERT REGUALOS</text>
    <text x="605" y="170" textLength="740" lengthAdjust="spacingAndGlyphs" fill="#250404">JESSIE ALBERT REGUALOS</text>
    <text x="604" y="169" textLength="740" lengthAdjust="spacingAndGlyphs" fill="#3B0A0A">JESSIE ALBERT REGUALOS</text>
    <text x="603" y="168" textLength="740" lengthAdjust="spacingAndGlyphs" fill="#5A0B0B">JESSIE ALBERT REGUALOS</text>
    <text x="602" y="167" textLength="740" lengthAdjust="spacingAndGlyphs" fill="#7A0000">JESSIE ALBERT REGUALOS</text>
    <text x="601" y="166" textLength="740" lengthAdjust="spacingAndGlyphs" fill="#8B0000">JESSIE ALBERT REGUALOS</text>
    <text x="600" y="165" textLength="740" lengthAdjust="spacingAndGlyphs" fill="url(#nameGrad)">JESSIE ALBERT REGUALOS</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="208" text-anchor="middle" class="mono" font-size="15" letter-spacing="4" fill="#C9D1D9" textLength="620" lengthAdjust="spacingAndGlyphs">FULL-STACK DEVELOPER · REACT · DJANGO · SUPABASE · C#</text>

  <!-- HUD: sync meter -->
  <g class="mono" font-size="11" fill="#8B9096">
    <path d="M24 44 V24 H44" fill="none" stroke="#C0392B" stroke-width="2"/>
    <path d="M1176 44 V24 H1156" fill="none" stroke="#C0392B" stroke-width="2"/>
    <path d="M24 316 V336 H44" fill="none" stroke="#C0392B" stroke-width="2"/>
    <path d="M1176 316 V336 H1156" fill="none" stroke="#C0392B" stroke-width="2"/>

    <text x="52" y="42" letter-spacing="2">ANIMUS SYNC</text>
    <rect x="52" y="50" width="160" height="6" fill="none" stroke="#3B0A0A"/>
    <rect x="52" y="50" width="0" height="6" fill="#C0392B">
      <animate attributeName="width" values="0;160;160" keyTimes="0;.55;1" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text x="1148" y="42" text-anchor="end" letter-spacing="2">ID // ALBERTJIN1</text>
    <circle cx="1148" cy="54" r="3" fill="#C0392B" class="spin"/>
    <text x="1138" y="58" text-anchor="end" letter-spacing="2">LINK ESTABLISHED</text>
  </g>

  <!-- Data motes -->
  <g fill="#FF6B5B">
    <rect x="320" y="70" width="3" height="3"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="880" y="88" width="3" height="3"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="260" y="200" width="2" height="2"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin=".5s" repeatCount="indefinite"/></rect>
    <rect x="955" y="220" width="2" height="2"><animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="2s" repeatCount="indefinite"/></rect>
    <rect x="430" y="230" width="2" height="2"><animate attributeName="opacity" values="0;1;0" dur="5s" begin="1.5s" repeatCount="indefinite"/></rect>
    <rect x="760" y="60" width="2" height="2"><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="2.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- Scanline sweep -->
  <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;360" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
