<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" width="420" height="130" role="img" aria-label="kioscorp-final">
  <title>kioscorp-final</title>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'Fira Code', 'Courier New', monospace; }
    .bob { animation: bob 4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#1A0606"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0392B"/><stop offset="1" stop-color="#3B0A0A"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="419" height="129" rx="10" fill="url(#bg)" stroke="#3B0A0A"/>
  <rect x=".5" y="14" width="3" height="102" fill="url(#accent)"/>

  <!-- decorative isometric cube -->
  <g class="bob" opacity=".9">
    <g transform="translate(372 44) scale(.55)">
      <polygon points="0,-40 34.64,-20 0,0 -34.64,-20" fill="#C0392B"/>
      <polygon points="-34.64,-20 0,0 0,40 -34.64,20" fill="#8B0000"/>
      <polygon points="0,0 34.64,-20 34.64,20 0,40" fill="#3B0A0A"/>
    </g>
  </g>

  <text x="22" y="28" class="mono" font-size="10" letter-spacing="3" fill="#8B9096">OPERATION 01</text>
  <!-- repo glyph -->
  <g transform="translate(22 41)" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-linejoin="round">
    <path d="M2 1 H12 V15 H4 A2 2 0 0 1 2 13 Z"/><path d="M2 13 A2 2 0 0 1 4 11 H12"/>
  </g>
  <text x="42" y="54" class="sans" font-size="18" font-weight="700" fill="#E5534B">kioscorp-final</text>
  <text x="22" y="78" class="sans" font-size="13" fill="#C9D1D9">Kiosk management system —</text>
  <text x="22" y="95" class="sans" font-size="13" fill="#C9D1D9">final release of the KiosCorp platform.</text>
  <circle cx="28" cy="110" r="5" fill="#F1E05A"/>
  <text x="40" y="114" class="sans" font-size="12" fill="#8B9096">JavaScript</text>
  
</svg>
