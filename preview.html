<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>README Preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-dark.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
<style>
  body { margin: 0; background: #0d1117; }
  .bar { position: sticky; top: 0; z-index: 2; background: #010409; border-bottom: 1px solid #30363d;
         color: #8b949e; font: 13px/1.4 -apple-system, "Segoe UI", sans-serif; padding: 10px 16px; }
  .bar b { color: #e6edf3; }
  .wrap { max-width: 1012px; margin: 24px auto; padding: 0 16px; }
  .frame { border: 1px solid #30363d; border-radius: 6px; }
  .frame-head { padding: 8px 16px; border-bottom: 1px solid #30363d; color: #e6edf3;
                font: 600 14px -apple-system, "Segoe UI", sans-serif; }
  .markdown-body { padding: 32px; background: #0d1117; }
  .markdown-body pre code.hljs { background: transparent; padding: 0; }
  .missing { display: block; padding: 40px 16px; border: 1px dashed #8B0000; border-radius: 6px;
             color: #8b949e; text-align: center; font: 13px "Segoe UI", sans-serif; }
  @media (max-width: 600px) { .markdown-body { padding: 16px; } }
</style>
</head>
<body>
<div class="bar"><b>Local preview</b> · approximates github.com/AlbertJin1 (dark theme). Edit README.md and refresh.</div>
<div class="wrap">
  <div class="frame">
    <div class="frame-head">AlbertJin1 / README.md</div>
    <article id="out" class="markdown-body">Loading…</article>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  fetch('README.md?' + Date.now()).then(r => r.text()).then(md => {
    const out = document.getElementById('out');
    out.innerHTML = marked.parse(md, { gfm: true });
    out.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    // The 3D terrain is generated by the GitHub Action; show a placeholder until it exists.
    out.querySelectorAll('img[src*="profile-3d-contrib"]').forEach(img => {
      img.addEventListener('error', () => {
        const s = document.createElement('span');
        s.className = 'missing';
        s.textContent = '3D contribution terrain appears here after the "Generate 3D contribution terrain" workflow runs on GitHub.';
        img.replaceWith(s);
      });
      if (img.complete && img.naturalWidth === 0) img.dispatchEvent(new Event('error'));
    });
  });
</script>
</body>
</html>
